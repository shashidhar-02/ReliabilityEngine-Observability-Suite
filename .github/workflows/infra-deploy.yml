name: Infrastructure Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Target environment
        options: [staging, prod]
        required: true
      apply:
        type: boolean
        description: Apply the reviewed plan
        default: false

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml

  plan-and-apply:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment == 'prod' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.13.4'
      - uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-tf-role
          aws-region: ap-south-1
      - name: Initialize, validate, and plan
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          terraform -chdir="terraform/env/$TARGET_ENV" init -input=false
          terraform -chdir="terraform/env/$TARGET_ENV" validate
          terraform -chdir="terraform/env/$TARGET_ENV" plan -input=false -out=deployment.tfplan
      - name: Apply the exact plan
        if: inputs.apply
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: terraform -chdir="terraform/env/$TARGET_ENV" apply -input=false deployment.tfplan
