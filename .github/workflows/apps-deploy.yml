name: Application Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      registry: ${{ steps.login.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr-role
          aws-region: ap-south-1
      - id: login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Build and push immutable images
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for app in payments-api orders-api; do
            if aws ecr describe-images --repository-name "$app" --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
              continue
            fi
            docker build -t "$REGISTRY/$app:$IMAGE_TAG" "./src/$app"
            docker push "$REGISTRY/$app:$IMAGE_TAG"
          done

  deploy:
    needs: publish
    # Use a deployment-only runner in the VPC; never run pull requests here.
    runs-on: [self-hosted, linux, x64, eks-vpc]
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-eks-role
          aws-region: ap-south-1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: v1.35.0
      - name: Configure cluster and collector
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name enterprise-sre-cluster-prod
          kubectl apply -k k8s-manifests/overlays/prod
          kubectl rollout status deployment/otel-collector -n observability --timeout=120s
      - name: Deploy exact images from ECR
        env:
          ECR_REGISTRY: ${{ needs.publish.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for app in payments-api orders-api; do
            helm upgrade --install "$app" "./src/$app/chart" --namespace default \
              -f "./src/$app/chart/values-prod.yaml" \
              --set-string "image.repository=$ECR_REGISTRY/$app" \
              --set-string "image.tag=$IMAGE_TAG" --atomic --wait --timeout 5m
          done
